<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StyleHub Support Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="chat-box">
    <div class="chat-header">StyleHub Support</div>

    <div class="chat-messages" id="messages">
      <div class="msg bot">Hi! Ask me about orders, refunds, shipping or payments.</div>
    </div>

    <div class="chat-input">
      <input type="text" id="user-input" placeholder="Type your question..." maxlength="200" autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
